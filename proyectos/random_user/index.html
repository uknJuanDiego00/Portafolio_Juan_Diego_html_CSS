<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.18.1/axios.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <title>Lista</title>
</head>

<body>

    <div id="cuerpo">
        <h1 class="titulo">Lista de usuarios "00"</h1>
        <div id="contenedor-cartas">

        </div>
    </div>

    <script>

        document.addEventListener("DOMContentLoaded", async () => {

            const res = await axios.get("https://randomuser.me/api/?results=100");

            const usuarios = res.data.results;

            document.querySelector("#contenedor-cartas").innerHTML =
                usuarios.map((usuario, index) => `
                
                <div class="carta" data-index="${index}">
                    <i class="fa-regular fa-star"></i>
                    <img class="avatar" src="${usuario.picture.large}">
                    <h4>${usuario.name.first} ${usuario.name.last}</h4>
                    <p>Género: ${usuario.gender}</p>
                    <p>Edad: ${usuario.dob.age} años</p>
                </div>

            `).join("");
            const cartas = document.querySelectorAll(".carta");
            cartas.forEach((carta, index) => {
                carta.addEventListener("click", () => {
                    const usuario = usuarios[index];
                    localStorage.setItem(
                        "usuarioSeleccionado",
                        JSON.stringify(usuario)
                    );
                    window.location.href = "./perfil/perfil.html";
                });

            });

            console.log(usuarios);

        });




    </script>

</body>

</html>
